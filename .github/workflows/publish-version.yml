# Turns an upload branch into a version on the Releases page, then deletes the branch.
# Push a branch named  upload/v1.2.3  containing ChamferTrackball.exe,
# ChamferTrackball-Admin.enc and notes.md  →  pre-release v1.2.3 (admin version; the admin app is published encrypted).
# Users only get a version after "Release for public" in the Admin app (public-v1.2.3).
name: Publish version
on:
  push:
    branches: ['upload/v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#upload/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version $tag"; exit 1; }
          for f in ChamferTrackball.exe ChamferTrackball-Admin.enc notes.md; do [ -f "$f" ] || { echo "missing $f"; exit 1; }; done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ChamferTrackball.exe ChamferTrackball-Admin.enc --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" ChamferTrackball.exe ChamferTrackball-Admin.enc \
              --target main --prerelease --latest=false \
              --title "Chamfer Trackball $tag (admin)" --notes-file notes.md
          fi
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size) \(.digest)"'
      - name: Remove the upload branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
