# Makes "Release for public" / "Withdraw" in the owner's Admin app happen (see relay.mjs).
name: Release relay
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: release-relay
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply signed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/relay.mjs
